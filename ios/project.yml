name: MakanApa
options:
  bundleIdPrefix: com.makanapa
  deploymentTarget:
    iOS: "18.0"
settings:
  SWIFT_VERSION: "6.0"
targets:
  MakanApa:
    type: application
    platform: iOS
    sources:
      - path: MakanApa
      - path: ../fixtures/restaurants.json
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.keirara.makanapa
      GENERATE_INFOPLIST_FILE: true
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "MakanApa uses your location to find food store or restaurant nearby."
      TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: MakanApa/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "MakanApa talks to its own dev server on your local network while testing."
        NSAppTransportSecurity:
          NSExceptionDomains:
            10.123.171.118:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
  MakanApaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MakanApaTests
    dependencies:
      - target: MakanApa
    settings:
      GENERATE_INFOPLIST_FILE: true
schemes:
  MakanApa:
    build:
      targets:
        MakanApa: all
        MakanApaTests: [test]
    test:
      targets:
        - MakanApaTests
    run:
      config: Debug
