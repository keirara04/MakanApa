<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none"
xmlns="http://www.w3.org/2000/svg">
  <title>MakanApa — Nasi Mascot</title>
  <desc>Cute rice mascot with sambal-red cap, spoon, rosy cheeks, and transparent background.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#29201D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Mascot group -->
  <g id="NasiMascot" filter="url(#softShadow)">

    <!-- Spoon behind body -->
    <g id="Spoon" transform="rotate(-18 260 300)">
      <ellipse cx="235" cy="205" rx="46" ry="70" fill="#D8D1C7" stroke="#29201D" stroke-width="18"/>
      <ellipse cx="235" cy="205" rx="26" ry="46" fill="#F2EEE7" opacity="0.65"/>
      <rect x="220" y="260" width="30" height="230" rx="15" fill="#D8D1C7" stroke="#29201D" stroke-width="18"/>
    </g>

    <!-- Left arm holding spoon -->
    <path d="M355 480C308 470 284 438 278 399" stroke="#29201D" stroke-width="28" stroke-linecap="round"/>
    <circle cx="281" cy="397" r="28" fill="#29201D"/>

    <!-- Right arm -->
    <path d="M679 494C733 478 765 447 780 409" stroke="#29201D" stroke-width="28" stroke-linecap="round"/>
    <circle cx="784" cy="406" r="27" fill="#29201D"/>

    <!-- Legs -->
    <path d="M454 748C448 805 432 844 408 879" stroke="#29201D" stroke-width="30" stroke-linecap="round"/>
    <path d="M579 748C587 804 605 844 628 878" stroke="#29201D" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="390" cy="894" rx="48" ry="23" fill="#29201D"/>
    <ellipse cx="646" cy="894" rx="48" ry="23" fill="#29201D"/>

    <!-- Rice body outline -->
    <path d="
      M326 580
      C295 547 303 503 340 482
      C307 437 330 389 375 380
      C360 334 396 300 440 308
      C455 269 503 252 537 281
      C568 252 616 267 632 306
      C678 298 714 333 699 379
      C745 388 768 436 735 481
      C773 503 781 547 749 580
      C780 623 759 670 716 682
      C703 727 661 747 624 730
      C599 770 550 783 514 754
      C478 782 428 770 405 731
      C367 748 325 726 313 682
      C270 671 250 623 281 580
      C292 568 307 561 326 580Z"
      fill="#FFF4DD" stroke="#29201D" stroke-width="24" stroke-linejoin="round"/>

    <!-- Rice texture -->
    <g id="RiceTexture" stroke="#E8D9BC" stroke-width="12" stroke-linecap="round" opacity="0.9">
      <path d="M404 377C420 361 438 358 453 365"/>
      <path d="M475 333C491 319 510 318 525 324"/>
      <path d="M554 330C570 320 588 322 601 331"/>
      <path d="M623 366C639 359 655 362 669 374"/>
      <path d="M362 447C378 435 394 436 408 444"/>
      <path d="M673 448C688 438 704 439 717 449"/>
      <path d="M398 642C414 632 430 633 444 642"/>
      <path d="M589 648C606 636 622 638 635 648"/>
    </g>

    <!-- Cap brim -->
    <path d="M553 301C616 282 681 295 728 334C735 341 732 353 724 358C674 387 613 397 553 387Z"
          fill="#C83D2D" stroke="#29201D" stroke-width="20" stroke-linejoin="round"/>

    <!-- Cap crown -->
    <path d="M507 314C522 249 592 201 664 219C727 235 761 290 746 347C687 326 623 319 553 327Z"
          fill="#E94B35" stroke="#29201D" stroke-width="20" stroke-linejoin="round"/>

    <!-- Cap panel detail -->
    <path d="M677 230C708 257 721 294 713 330" stroke="#B73427" stroke-width="14" stroke-linecap="round"/>

    <!-- Cap text -->
    <g id="CapText" fill="#FFF4DD" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="700">
      <text x="622" y="274" font-size="28" transform="rotate(8 622 274)">JOM</text>
      <text x="622" y="309" font-size="28" transform="rotate(8 622 309)">MAKAN</text>
    </g>

    <!-- Eyes -->
    <ellipse cx="451" cy="500" rx="18" ry="27" fill="#29201D"/>
    <path d="M590 499C608 483 626 484 642 499" stroke="#29201D" stroke-width="18" stroke-linecap="round"/>

    <!-- Brows -->
    <path d="M430 455C445 443 461 442 475 449" stroke="#D9C6A7" stroke-width="10" stroke-linecap="round"/>
    <path d="M594 452C608 441 625 441 639 450" stroke="#D9C6A7" stroke-width="10" stroke-linecap="round"/>

    <!-- Cheeks -->
    <ellipse cx="392" cy="556" rx="34" ry="24" fill="#F48C73"/>
    <ellipse cx="668" cy="556" rx="34" ry="24" fill="#F48C73"/>

    <!-- Smile mouth -->
    <path d="M486 542C505 553 529 554 551 542C554 580 540 608 519 608C498 608 483 580 486 542Z"
          fill="#29201D" stroke="#29201D" stroke-width="10" stroke-linejoin="round"/>
    <path d="M503 586C515 575 528 575 538 586C530 598 522 602 515 602C510 602 506 596 503 586Z"
          fill="#E94B35"/>

    <!-- Tiny celebratory marks -->
    <g stroke="#F4B942" stroke-width="18" stroke-linecap="round">
      <path d="M305 316L278 281"/>
      <path d="M339 295L324 252"/>
      <path d="M783 544L822 526"/>
      <path d="M792 578L836 579"/>
    </g>
  </g>
</svg>
