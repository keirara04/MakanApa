<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          color: var(--ink);
        }
        #end-shadow {
          position: absolute;
          left: 410px;
          top: 742px;
          width: 260px;
          height: 44px;
          border-radius: 50%;
          background: radial-gradient(ellipse, rgb(26 19 16 / 0.24) 0%, rgb(26 19 16 / 0) 70%);
        }
        #end-mascot {
          position: absolute;
          left: 315px;
          top: 300px;
          width: 450px;
          height: 450px;
        }
        #end-copy {
          position: absolute;
          left: 60px;
          right: 60px;
          top: 800px;
          text-align: center;
        }
        #end-word {
          font-size: 216px;
          line-height: 1;
          white-space: nowrap;
        }
        #end-word .apa {
          color: var(--chili-deep);
        }
        #end-tag {
          margin-top: 16px;
          font-size: 50px;
          font-weight: 500;
          color: var(--ink-60);
        }
        #end-cta {
          position: relative;
          display: inline-flex;
          align-items: center;
          gap: 22px;
          margin-top: 64px;
          height: 120px;
          padding: 0 62px;
          overflow: hidden;
          border-radius: 60px;
          background: var(--ink);
          color: var(--cream);
          font-size: 42px;
          font-weight: 800;
        }
        #end-cta svg {
          width: 36px;
          height: 36px;
          fill: none;
          stroke: var(--cream);
          stroke-width: 2.8;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #end-shine {
          position: absolute;
          top: 0;
          left: 0;
          width: 50%;
          height: 100%;
          background: linear-gradient(105deg, rgb(255 255 255 / 0) 20%, rgb(255 255 255 / 0.25) 50%, rgb(255 255 255 / 0) 80%);
        }
        #end-share {
          position: absolute;
          left: 140px;
          right: 140px;
          top: 1330px;
          text-align: center;
          font-size: 40px;
          line-height: 1.3;
          color: var(--ink);
        }
        #end-share em {
          font-family: var(--serif);
          font-size: 50px;
          color: var(--chili-deep);
        }
      </style>

      <div id="root" data-composition-id="end" data-width="1080" data-height="1920">
        <div id="end-shadow" data-layout-ignore></div>
        <img id="end-mascot" src="assets/mascot/default.svg" alt="" />
        <div id="end-copy">
          <h2 id="end-word" class="serif" data-layout-allow-overlap><span data-split>Makan</span><span class="apa it" data-split>Apa?</span></h2>
          <p id="end-tag">Lunch, decided.</p>
          <span id="end-cta">
            <span id="end-shine" data-layout-allow-overflow></span>
            Free on the App Store
            <svg viewBox="0 0 36 36"><path d="M8 18h19M20 11l7 7-7 7" /></svg>
          </span>
        </div>
        <p id="end-share">Send this to the friend who always says <em>“anywhere.”</em></p>
      </div>

      <script>
        document.querySelectorAll('[data-composition-id="end"] [data-split]').forEach((el) => {
          const text = el.textContent.trim();
          el.textContent = "";
          for (const ch of text) {
            const s = document.createElement("span");
            s.className = "ch";
            s.setAttribute("data-layout-allow-overlap", "");
            s.textContent = ch;
            el.appendChild(s);
          }
        });

        const tl = gsap.timeline({ paused: true });
        // Global 28.0 hit.
        tl.fromTo(
          "#end-mascot",
          { opacity: 0, scale: 1.7, y: -40, filter: "blur(16px)" },
          { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.4)" },
          0,
        );
        tl.fromTo("#end-shadow", { opacity: 0, scaleX: 0.5 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.1);
        tl.fromTo(
          "#end-word .ch",
          { opacity: 0, y: 80, filter: "blur(14px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out", stagger: 0.03 },
          0.08,
        );
        tl.fromTo("#end-tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.35);
        tl.fromTo("#end-cta", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.5);
        tl.fromTo("#end-shine", { xPercent: -120 }, { xPercent: 260, duration: 0.8, ease: "power2.inOut" }, 1.0);
        tl.fromTo("#end-share", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.7);
        tl.to("#end-mascot", { y: -14, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.55);
        tl.to("#end-shadow", { scaleX: 0.85, opacity: 0.7, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.62);

        window.__timelines["end"] = tl;
      </script>
    </template>
  </body>
</html>
