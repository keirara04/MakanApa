<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #wh-head {
          position: absolute;
          left: 80px;
          top: 300px;
          font-size: 176px;
          line-height: 0.92;
        }
        #wh-head .it {
          color: var(--chili);
        }
        #wh-step {
          position: absolute;
          left: 80px;
          top: 250px;
          font-size: 26px;
          color: var(--chili);
        }

        /* Wheel window: band centre sits at y 1100, where the light burst starts. */
        #wh-fade {
          position: absolute;
          left: 0;
          top: 720px;
          width: 1080px;
          height: 760px;
          opacity: 0;
        }
        #wh-band {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 310px;
          height: 140px;
          border-radius: 32px;
          border: 1.5px solid var(--cream-12);
          background: rgb(245 238 227 / 0.05);
        }
        #wh-blur {
          position: absolute;
          inset: 0;
          -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
        }
        #wh-view {
          position: absolute;
          inset: 0;
          perspective: 1500px;
        }
        #wh-wheel {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }
        .wh-dish {
          position: absolute;
          left: 0;
          top: 310px;
          width: 1080px;
          height: 140px;
          font-size: 104px;
          line-height: 140px;
          text-align: center;
          white-space: nowrap;
          color: var(--cream);
          backface-visibility: hidden;
        }

        /* The button that starts it all. */
        #wh-btn {
          position: absolute;
          left: 160px;
          top: 1025px;
          width: 760px;
          height: 150px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 22px;
          border-radius: 75px;
          background: var(--chili);
          color: #fff7ee;
          font-size: 54px;
          font-weight: 800;
          letter-spacing: -0.01em;
          box-shadow: 0 30px 80px -20px rgb(255 91 58 / 0.7);
        }
        #wh-btn svg {
          width: 50px;
          height: 50px;
          fill: #fff7ee;
        }
        #wh-ripple {
          position: absolute;
          left: 160px;
          top: 1025px;
          width: 760px;
          height: 150px;
          border-radius: 75px;
          border: 4px solid var(--chili);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="wheel" data-width="1080" data-height="1920">
        <p id="wh-step" class="caps">The best part</p>
        <h2 id="wh-head" class="serif" data-layout-allow-overlap>
          <span class="mask"><span>Then let it</span></span>
          <span class="mask"><span class="it">decide.</span></span>
        </h2>

        <div id="wh-fade">
          <div id="wh-band"></div>
          <div id="wh-blur" data-layout-allow-overflow data-layout-allow-overlap>
            <div id="wh-view">
              <div id="wh-wheel"></div>
            </div>
          </div>
        </div>

        <div id="wh-ripple" data-layout-ignore></div>
        <div id="wh-btn">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.6L21 9l-5.4 4.1L17.6 20 12 16l-5.6 4 2-6.9L3 9l6.8-.4z" /></svg>
          Decide for me
        </div>
      </div>

      <script>
        // 16 dishes on a cylinder, 22.5 deg apart. Index 5 is the pick.
        const DISHES = [
          "Nasi lemak", "Roti canai", "Char kuey teow", "Laksa", "Mee goreng", "Nasi kandar",
          "Satay", "Chicken rice", "Mee rebus", "Bak kut teh", "Nasi kerabu", "Wantan mee",
          "Rojak", "Nasi goreng", "Cendol", "Murtabak",
        ];
        const STEP = 360 / DISHES.length;
        const RADIUS = Math.round(70 / Math.tan((STEP / 2) * (Math.PI / 180)));
        const PICK = 5;
        const wheel = document.getElementById("wh-wheel");
        DISHES.forEach((name, i) => {
          const el = document.createElement("div");
          el.className = "wh-dish serif";
          el.id = `wh-dish-${i}`;
          el.setAttribute("data-layout-allow-overlap", ""); // back faces are hidden; boxes still intersect in 2D
          el.textContent = name;
          el.style.transform = `rotateX(${i * STEP}deg) translateZ(${RADIUS}px)`;
          wheel.appendChild(el);
        });

        const tl = gsap.timeline({ paused: true });

        // Global 20.0: header + button in. 20.5: press, spin. 22.0: land on the downbeat.
        tl.fromTo("#wh-step", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.02);
        tl.fromTo("#wh-head .mask > span", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power4.out", stagger: 0.08 }, 0.02);
        tl.fromTo("#wh-btn", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
        tl.to("#wh-btn", { scale: 0.9, duration: 0.07, ease: "power2.in" }, 0.43);
        tl.to("#wh-btn", { scale: 1.06, opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.out" }, 0.5);
        tl.fromTo("#wh-ripple", { scale: 1, opacity: 1 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.5);

        tl.to("#wh-fade", { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.5);
        tl.fromTo("#wh-wheel", { rotationX: 0 }, { rotationX: -(1440 + PICK * STEP), duration: 1.5, ease: "power4.out" }, 0.5);
        tl.fromTo("#wh-blur", { filter: "blur(7px)" }, { filter: "blur(0px)", duration: 1.3, ease: "power3.out" }, 0.5);

        // Land: the pick turns gold, the band locks on.
        tl.to(`#wh-dish-${PICK}`, { color: "#ffb938", duration: 0.12, ease: "power1.out" }, 2.0);
        tl.to("#wh-band", { borderColor: "rgb(255 185 56 / 0.75)", backgroundColor: "rgb(255 185 56 / 0.12)", duration: 0.12, ease: "power1.out" }, 2.0);
        tl.fromTo("#wh-fade", { scale: 1 }, { scale: 1.06, duration: 0.5, ease: "expo.out" }, 2.0);

        window.__timelines["wheel"] = tl;
      </script>
    </template>
  </body>
</html>
