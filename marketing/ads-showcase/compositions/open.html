<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .op-line {
          position: absolute;
          left: 0;
          right: 0;
          top: 880px;
          text-align: center;
          font-size: 92px;
          opacity: 0;
        }
        #op-3 {
          top: 850px;
          font-size: 128px;
        }
        #op-beam {
          position: absolute;
          left: 140px;
          top: 1060px;
          display: block;
          width: 800px;
          height: 2px;
          background: linear-gradient(90deg, rgb(255 255 255 / 0), rgb(255 255 255 / 0.85), rgb(255 255 255 / 0));
          box-shadow: 0 0 24px rgb(255 255 255 / 0.5);
          transform-origin: center;
        }
      </style>

      <div id="root" data-composition-id="open" data-width="1080" data-height="1920">
        <p id="op-1" class="op-line hl" style="font-weight: 600">Every day.</p>
        <p id="op-2" class="op-line hl" style="font-weight: 600">Same question.</p>
        <p id="op-3" class="op-line hl">What's for <span class="grad">lunch?</span></p>
        <span id="op-beam" data-layout-ignore></span>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // Piano notes at 0.3 / 1.3 / 2.25.
        tl.fromTo("#op-1", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0.3);
        tl.to("#op-1", { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 1.0);
        tl.fromTo("#op-2", { opacity: 0, y: 24, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 1.3);
        tl.to("#op-2", { opacity: 0, y: -16, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 1.95);
        tl.fromTo(
          "#op-3",
          { opacity: 0, scale: 0.94, filter: "blur(16px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" },
          2.25,
        );
        tl.fromTo("#op-beam", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "expo.out" }, 2.3);
        // The phone rises out of the beam at 3.0.
        tl.to("#op-3", { opacity: 0, y: -60, filter: "blur(14px)", duration: 0.35, ease: "power2.in" }, 2.85);
        tl.to("#op-beam", { scaleX: 1.6, opacity: 0, duration: 0.45, ease: "power2.in" }, 2.85);

        window.__timelines["open"] = tl;
      </script>
    </template>
  </body>
</html>
