<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Nasi — MakanApa Local Favorites avatar</title>
  <desc id="description">A smiling, rounded rice character with a green banana leaf, tiny arms and feet, and rosy cheeks.</desc>

  <defs>
    <radialGradient id="rice" cx="31%" cy="22%" r="82%" fx="30%" fy="20%">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="0.49" stop-color="#fff9ef"/>
      <stop offset="0.79" stop-color="#f0e7d9"/>
      <stop offset="1" stop-color="#d7c9b7"/>
    </radialGradient>
    <linearGradient id="riceSide" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fffefa" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#e5d9c8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#bda992" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#dfcfbb"/>
    </linearGradient>
    <linearGradient id="foot" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7fbd66"/>
      <stop offset="0.48" stop-color="#5e9e4c"/>
      <stop offset="1" stop-color="#407c3b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0.08" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#a9d77c"/>
      <stop offset="0.36" stop-color="#76bb62"/>
      <stop offset="0.7" stop-color="#4c9a52"/>
      <stop offset="1" stop-color="#307c48"/>
    </linearGradient>
    <linearGradient id="leafRim" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5aab5a"/>
      <stop offset="1" stop-color="#2b7744"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop offset="0" stop-color="#eaa59f" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#eaa59f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="riceClip">
      <path d="M256 121C180 121 119 181 105 258c-10 48-2 102 28 138 28 33 68 49 123 49s95-16 123-49c30-36 38-90 28-138-14-77-75-137-151-137Z"/>
    </clipPath>
  </defs>

  <!-- The small shoes and hands sit behind the rice body. -->
  <path d="M201 414c-14 3-25 15-27 29-2 12 8 21 24 22 17 1 35-5 41-15 8-13-2-31-18-35-7-2-14-2-20-1Z" fill="url(#foot)" stroke="#3d783d" stroke-width="3"/>
  <path d="M311 414c14 3 25 15 27 29 2 12-8 21-24 22-17 1-35-5-41-15-8-13 2-31 18-35 7-2 14-2 20-1Z" fill="url(#foot)" stroke="#3d783d" stroke-width="3"/>
  <path d="M187 437c-3 7 1 12 11 13" fill="none" stroke="#b9df96" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>
  <path d="M325 437c3 7-1 12-11 13" fill="none" stroke="#b9df96" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>

  <path d="M113 288c-19-8-36 1-40 17-4 16 3 34 19 42 14 7 28-1 34-15l12-32Z" fill="url(#arm)" stroke="#d6c6b2" stroke-width="3"/>
  <path d="M399 288c19-8 36 1 40 17 4 16-3 34-19 42-14 7-28-1-34-15l-12-32Z" fill="url(#arm)" stroke="#d6c6b2" stroke-width="3"/>
  <path d="M83 312c-2 10 2 19 9 23" fill="none" stroke="#fffdfa" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M429 312c2 10-2 19-9 23" fill="none" stroke="#fffdfa" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Rounded triangular rice shape with a soft highlight and a shaded right edge. -->
  <path d="M256 121C180 121 119 181 105 258c-10 48-2 102 28 138 28 33 68 49 123 49s95-16 123-49c30-36 38-90 28-138-14-77-75-137-151-137Z" fill="url(#rice)" stroke="#d9cbbb" stroke-width="3"/>
  <g clip-path="url(#riceClip)">
    <path d="M301 119c76 32 118 117 110 199-5 57-36 103-94 131 77-13 127-72 127-150 0-84-53-153-143-180Z" fill="url(#riceSide)"/>
    <path d="M126 261c13-55 42-87 82-105" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="16" stroke-linecap="round"/>
    <path d="M151 391c29 29 63 40 105 40" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- One broad banana leaf folds over the top like a soft cap. -->
  <path d="M149 179c14-49 51-83 100-94 49-11 94 8 122 50-29 28-70 44-110 48-48 5-86 3-112-4Z" fill="url(#leaf)" stroke="#357e47" stroke-width="3" stroke-linejoin="round"/>
  <path d="M149 179c42 11 91 13 139 2 39-9 65-24 83-46-10 24-38 45-82 56-53 13-105 9-140-12Z" fill="url(#leafRim)" opacity="0.9"/>
  <path d="M170 165c43-27 111-47 183-31" fill="none" stroke="#c1e398" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M198 151c-1-15 2-28 9-39m39 26c2-15 7-30 16-43m29 43c8-12 17-21 27-28" fill="none" stroke="#d3e9aa" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round"/>
  <path d="M172 171c18 4 38 6 61 5" fill="none" stroke="#e1f1b9" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>

  <!-- Face details stay bold enough to read at profile-icon size. -->
  <ellipse cx="173" cy="328" rx="30" ry="18" fill="url(#blush)"/>
  <ellipse cx="339" cy="328" rx="30" ry="18" fill="url(#blush)"/>
  <circle cx="211" cy="299" r="12" fill="#342f2e"/>
  <circle cx="301" cy="299" r="12" fill="#342f2e"/>
  <circle cx="207" cy="295" r="3.5" fill="#fffdfa"/>
  <circle cx="297" cy="295" r="3.5" fill="#fffdfa"/>
  <path d="M231 337c12 17 38 17 50 0" fill="none" stroke="#795245" stroke-width="7" stroke-linecap="round"/>
</svg>
