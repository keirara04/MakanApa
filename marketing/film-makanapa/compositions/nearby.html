<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #nb-rig { position: absolute; left: 230px; top: 306px; width: 620px; height: 1308px; }
        #nb-3d { position: absolute; inset: 0; transform-style: preserve-3d; }
        .nb-head { top: 150px; }
      </style>

      <div id="root" data-composition-id="nearby" data-width="1080" data-height="1920">
        <p id="nb-h1" class="two nb-head" data-layout-allow-overlap>Explore nearby.<br /><span>Search a dish. See it on the map.</span></p>
        <p id="nb-h2" class="two nb-head" data-layout-allow-overlap>Save it for later.<br /><span>Or go now.</span></p>
        <div id="nb-rig" data-layout-allow-overflow><div id="nb-3d" data-layout-allow-overflow></div></div>
      </div>

      <script>
        document.getElementById("nb-3d").innerHTML = MA.phone("nb", MA.nearby("nb"));
        document.querySelectorAll('[data-composition-id="nearby"] .iphone').forEach((el) => el.setAttribute("data-layout-ignore", ""));
        const QUERY = "nasi lemak";
        document.getElementById("nb-field-typed").innerHTML = [...QUERY].map((c) => `<span class="nb-ch" style="opacity:0">${c}</span>`).join("");
        gsap.set("#nb-sheet", { y: 900 });

        const tl = gsap.timeline({ paused: true });
        // Local 0 = global 32.0.
        function tap(x, y, at) {
          tl.set("#nb-touch", { x, y }, at - 0.14);
          tl.fromTo("#nb-touch", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 0.88, duration: 0.14, ease: "power2.out", immediateRender: false }, at - 0.14);
          tl.to("#nb-touch", { opacity: 0, scale: 1.15, duration: 0.3, ease: "power2.out" }, at + 0.02);
        }
        function head(sel, inAt, outAt) {
          tl.fromTo(sel, { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, inAt);
          tl.to(sel, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, outAt);
        }
        const MATCH = [2, 3, 6];
        const OTHER = [0, 1, 4, 5, 7];

        tl.fromTo("#nb-rig", { y: 1300, scale: 0.86 }, { y: 250, duration: 1.0, ease: "power3.out" }, 0);
        tl.fromTo("#nb-3d", { rotationY: -30, rotationX: 12, transformPerspective: 2600 }, { rotationY: -4, rotationX: 3, duration: 1.2, ease: "power2.out" }, 0);
        tl.to("#nb-3d", { rotationY: 4, rotationX: 2, duration: 3.0, ease: "sine.inOut" }, 1.2);
        tl.fromTo("#nb-glare", { xPercent: -45 }, { xPercent: 40, duration: 1.4, ease: "power2.inOut" }, 0.3);
        head("#nb-h1", 0.2, 4.4);

        // Search a dish; the matching places stand out on the map.
        tap(542, 126, 1.0);
        tl.to("#nb-ribbon", { opacity: 0, duration: 0.15 }, 1.05);
        tl.fromTo("#nb-field", { opacity: 0, scaleX: 0.2, transformOrigin: "100% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, 1.08);
        tl.to("#nb-field-ph", { opacity: 0, duration: 0.1 }, 1.4);
        tl.to("#nb-field-typed .nb-ch", { opacity: 1, duration: 0.01, stagger: 0.6 / QUERY.length, ease: "none" }, 1.45);
        tl.to(OTHER.map((i) => `#nb-pin-${i}`), { opacity: 0.2, duration: 0.3 }, 2.15);
        MATCH.forEach((i, k) => {
          tl.to(`#nb-pin-${i}`, { boxShadow: "0 0 0 3px #e94b35, 0 6px 16px rgba(0,0,0,0.2)", duration: 0.2 }, 2.2 + k * 0.08);
          tl.fromTo(`#nb-pin-${i}`, { scale: 1 }, { scale: 1.25, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 2.2 + k * 0.08);
        });

        // Open one: the place sheet.
        tap(300, 540, 3.0);
        tl.to("#nb-sheet", { y: 0, duration: 0.5, ease: "power3.out" }, 3.1);
        head("#nb-h2", 4.75, 9.2);
        tl.to("#nb-rig", { scale: 1.3, y: -40, duration: 1.2, ease: "power3.inOut" }, 4.0);
        tap(487, 538, 5.6);
        tl.to("#nb-heart-on", { opacity: 1, duration: 0.1 }, 5.62);
        tl.fromTo("#nb-heart", { scale: 1 }, { scale: 1.35, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 5.62);
        tl.to("#nb-rig", { scale: 0.86, y: 250, duration: 1.0, ease: "power3.inOut" }, 7.2);

        // Close it all so the next chapter starts from the plain map.
        tl.to("#nb-sheet", { y: 900, duration: 0.45, ease: "power3.in" }, 8.6);
        tl.to("#nb-field", { opacity: 0, duration: 0.2 }, 9.1);
        tl.to("#nb-ribbon", { opacity: 1, duration: 0.2 }, 9.2);
        tl.to(OTHER.map((i) => `#nb-pin-${i}`), { opacity: 1, duration: 0.3 }, 9.2);
        tl.to(MATCH.map((i) => `#nb-pin-${i}`), { boxShadow: "0 4px 12px rgba(0,0,0,0.18)", duration: 0.3 }, 9.2);
        tl.to("#nb-3d", { rotationY: 0, rotationX: 0, duration: 0.8, ease: "sine.inOut" }, 9.2);

        window.__timelines["nearby"] = tl;
      </script>
    </template>
  </body>
</html>
