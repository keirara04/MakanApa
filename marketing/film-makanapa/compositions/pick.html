<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #pk-rig { position: absolute; left: 230px; top: 306px; width: 620px; height: 1308px; }
        #pk-3d { position: absolute; inset: 0; transform-style: preserve-3d; }
        .pk-head { top: 150px; }
      </style>

      <div id="root" data-composition-id="pick" data-width="1080" data-height="1920">
        <p id="pk-h1" class="two pk-head" data-layout-allow-overlap>Pick for me.<br /><span>One tap. Done.</span></p>
        <p id="pk-h2" class="two pk-head" data-layout-allow-overlap>Picked for you.<br /><span>The place, the price, the walk.</span></p>
        <div id="pk-rig" data-layout-allow-overflow><div id="pk-3d" data-layout-allow-overflow></div></div>
      </div>

      <script>
        const RESULT = {
          photo: "assets/photos/MeeGoreng.jpg",
          name: "Restoran Mamak Bistari",
          details: "Mamak · ≈ RM12/person · 8 min walk · Open until 2 AM",
          chips: ["Anything", "~RM20", "10 min"],
        };
        document.getElementById("pk-3d").innerHTML = MA.phone("pk", MA.home("pk") + MA.loading("pk", "Anything") + MA.result("pk", RESULT));
        document.querySelectorAll('[data-composition-id="pick"] .iphone').forEach((el) => el.setAttribute("data-layout-ignore", ""));
        gsap.set(["#pk-loading", "#pk-result"], { opacity: 0 });
        gsap.set("#pk-rig", { y: 250, scale: 0.86 });

        const tl = gsap.timeline({ paused: true });
        // Local 0 = global 5.0. Tap 5.75, result 7.5, close-up 8.0-10.4.
        function tap(x, y, at) {
          tl.set("#pk-touch", { x, y }, at - 0.14);
          tl.fromTo("#pk-touch", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 0.88, duration: 0.14, ease: "power2.out", immediateRender: false }, at - 0.14);
          tl.to("#pk-touch", { opacity: 0, scale: 1.15, duration: 0.3, ease: "power2.out" }, at + 0.02);
        }
        function head(sel, inAt, outAt) {
          tl.fromTo(sel, { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, inAt);
          tl.to(sel, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, outAt);
        }

        head("#pk-h1", 0.05, 2.2);
        tap(295, 315, 0.75);
        tl.to("#pk-quick", { scale: 0.97, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, 0.78);
        tl.to("#pk-loading", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.95);
        tl.fromTo("#pk-load-mascot", { y: 0 }, { y: -26, duration: 0.3, ease: "sine.out", yoyo: true, repeat: 3, immediateRender: false }, 1.1);
        tl.fromTo("#pk-spin", { rotation: 0 }, { rotation: 720, duration: 1.4, ease: "none", immediateRender: false }, 1.0);

        // The pick lands; then the camera moves in on it.
        tl.to("#pk-result", { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.4);
        tl.fromTo("#pk-hero img", { scale: 1.12 }, { scale: 1, duration: 2.5, ease: "power2.out", immediateRender: false }, 2.4);
        tl.fromTo("#pk-res-body > *", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 2.55);
        head("#pk-h2", 2.6, 4.3);
        tl.to("#pk-rig", { scale: 1.45, y: -60, duration: 1.3, ease: "power3.inOut" }, 4.4);
        tl.to("#pk-3d", { rotationY: -8, rotationX: 4, transformPerspective: 2600, duration: 2.0, ease: "sine.inOut" }, 4.4);
        tl.to("#pk-rig", { scale: 0.86, y: 250, duration: 0.9, ease: "power3.inOut" }, 6.45);
        tl.to("#pk-3d", { rotationY: 0, rotationX: 0, duration: 0.9, ease: "power3.inOut" }, 6.45);
        tap(200, 1182, 7.45);
        tl.to("#pk-go", { scale: 0.96, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, 7.47);
        // Back to Home for the next chapter.
        tl.to(["#pk-result", "#pk-loading"], { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 7.85);

        window.__timelines["pick"] = tl;
      </script>
    </template>
  </body>
</html>
