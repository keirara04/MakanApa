; Code inside the image never changes after build, so skip the per-request stat() of every
; included file. A redeploy is a new container, which starts with an empty OPcache anyway.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Laravel/Filament read attributes and docblocks via reflection — comments must be kept.
opcache.save_comments = 1
