# Caching for static files Apache serves straight from public/. Laravel never sees these requests,
# so its middleware can't set their headers. `Header set` only touches successful responses, and a
# missing file is rewritten to index.php (outside these directories), so 404s are never cached.

<IfModule mod_headers.c>
    # Vite output: every filename carries a content hash, so a changed file is a new URL.
    <Directory /var/www/html/public/build>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Images, clips and self-hosted fonts keep their names when replaced: a week, then revalidate.
    <DirectoryMatch "^/var/www/html/public/(images|videos|fonts)/">
        Header set Cache-Control "public, max-age=604800"
    </DirectoryMatch>
</IfModule>

# Debian's deflate.conf covers HTML/CSS/JS; add the other text types the site serves.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE image/svg+xml application/json application/ld+json application/xml text/plain
</IfModule>
