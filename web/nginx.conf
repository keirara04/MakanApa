# Static host for the web app. TLS ends at Dokploy's Traefik; this serves plain HTTP behind it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx's stock mime.types has no entry for the web app manifest.
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # What a meta tag can't carry (the rest of the security policy ships in index.html).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Hashed build files never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker and the pages must always be checked, or updates never reach people.
    location ~ ^/(sw\.js|index\.html|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        try_files $uri =404;
    }

    # Digital Asset Links for the Google Play app (Phase 8), served as JSON.
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    # Every app path (/nearby, /p/624-kfc, ...) is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        try_files $uri $uri/ /index.html;
    }
}
